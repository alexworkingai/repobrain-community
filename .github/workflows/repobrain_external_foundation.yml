name: RepoBrain External GitHub Foundation

on:
  workflow_call:
    inputs:
      dry_run:
        description: "true = print only, false = post comment"
        required: false
        default: "false"
        type: string
      comment_text:
        description: "RepoBrain command text"
        required: false
        default: ""
        type: string
      issue_number:
        description: "Issue/PR number (digits or #N)"
        required: false
        default: ""
        type: string
      workflow_path:
        description: "Caller workflow path used for readiness checks"
        required: false
        default: ".github/workflows/repobrain_external.yml"
        type: string
      caller_event_name:
        description: "Caller event name (issue_comment/workflow_dispatch)"
        required: false
        default: "workflow_dispatch"
        type: string
    secrets:
      RB_GH_APP_ID:
        required: false
      RB_GH_APP_INSTALLATION_ID:
        required: false
      RB_GH_APP_PRIVATE_KEY:
        required: false
      RB_GH_APP_WEBHOOK_SECRET:
        required: false

permissions:
  contents: read
  models: read
  checks: write
  statuses: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  repobrain_external_foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve external GitHub foundation command boundary
        id: cmd_gate
        shell: bash
        run: |
          comment="${{ inputs.comment_text }}"
          cmd=""
          if [[ "$comment" =~ ^/repobrain[[:space:]]+([a-zA-Z_-]+) ]]; then
            cmd="${BASH_REMATCH[1]}"
          else
            cmd="help"
          fi
          cmd="$(echo "$cmd" | tr '[:upper:]' '[:lower:]')"
          if [[ "$cmd" == "help" || "$cmd" == "doctor" || "$cmd" == "ask" || "$cmd" == "review" ]]; then
            supported="1"
          else
            supported="0"
          fi
          echo "cmd=$cmd" >> "$GITHUB_OUTPUT"
          echo "supported=$supported" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v7
        id: checkout_ref
        if: always()
        with:
          script: |
            let ref = context.sha;
            let reason = "default_workflow_sha";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueRaw = `${{ inputs.issue_number }}`.trim();
            const issueNumber = Number(String(issueRaw).replace(/^#/, ""));
            if (issueNumber) {
              try {
                const { data: pull } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: issueNumber,
                });
                const baseRepo = `${owner}/${repo}`.toLowerCase();
                const headRepo = String(pull.head?.repo?.full_name || "").toLowerCase();
                const headSha = String(pull.head?.sha || "").trim();
                if (headRepo === baseRepo && headSha && String(pull.state || "").toLowerCase() === "open") {
                  ref = headSha;
                  reason = "same_repo_pr_head_sha";
                } else if (headRepo !== baseRepo) {
                  reason = "fork_pr_uses_default_branch_runtime";
                } else if (String(pull.state || "").toLowerCase() !== "open") {
                  reason = "closed_pr_uses_default_branch_runtime";
                } else {
                  reason = "missing_pr_head_sha";
                }
              } catch (error) {
                core.info(`PR head resolution skipped: ${error}`);
                reason = "pull_lookup_failed";
              }
            } else {
              reason = "issue_number_not_provided";
            }
            core.info(`RepoBrain external checkout ref resolution: ${reason} -> ${ref}`);
            core.setOutput("ref", ref);
            core.setOutput("reason", reason);

      - name: Checkout caller repository
        if: always()
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout_ref.outputs.ref }}

      - name: Collect bounded PR context
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueRaw = String(process.env.ISSUE_NUMBER || "").trim();
            const issueNumber = Number(issueRaw.replace(/^#/, ""));
            const payload = {
              issue_number: issueNumber || null,
              is_pull_request: false,
              pull_request: null,
            };
            if (issueNumber) {
              try {
                const { data: pull } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: issueNumber,
                });
                const { data: files } = await github.rest.pulls.listFiles({
                  owner,
                  repo,
                  pull_number: issueNumber,
                  per_page: 20,
                });
                payload.is_pull_request = true;
                payload.pull_request = {
                  number: pull.number,
                  title: String(pull.title || "").trim(),
                  body: String(pull.body || "").trim(),
                  state: String(pull.state || "").trim(),
                  changed_files: Number(pull.changed_files || files.length || 0),
                  files: files.map((file) => ({
                    filename: String(file.filename || "").trim(),
                    status: String(file.status || "").trim(),
                    additions: Number(file.additions || 0),
                    deletions: Number(file.deletions || 0),
                    patch_available: Boolean(file.patch),
                    patch_excerpt: String(file.patch || "").trim().slice(0, 1000),
                  })),
                };
              } catch (error) {
                core.info(`PR context collection skipped: ${error}`);
              }
            }
            fs.mkdirSync(path.join(process.cwd(), 'artifacts'), { recursive: true });
            fs.writeFileSync(
              path.join(process.cwd(), 'artifacts', 'pr_context.json'),
              JSON.stringify(payload, null, 2),
              'utf8'
            );

      - name: Setup Python for self-contained foundation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bounded response and self-contained artifacts
        id: foundation_build
        shell: bash
        env:
          COMMENT_TEXT: ${{ inputs.comment_text }}
          COMMAND: ${{ steps.cmd_gate.outputs.cmd }}
          SUPPORTED: ${{ steps.cmd_gate.outputs.supported }}
          DRY_RUN: ${{ inputs.dry_run }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CALLER_EVENT_NAME: ${{ inputs.caller_event_name }}
          WORKFLOW_PATH: ${{ inputs.workflow_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RB_GH_APP_ID: ${{ secrets.RB_GH_APP_ID || vars.RB_GH_APP_ID }}
          RB_GH_APP_ID_SOURCE: ${{ secrets.RB_GH_APP_ID != '' && 'secret' || (vars.RB_GH_APP_ID != '' && 'vars' || 'missing') }}
          RB_GH_APP_INSTALLATION_ID: ${{ secrets.RB_GH_APP_INSTALLATION_ID || vars.RB_GH_APP_INSTALLATION_ID }}
          RB_GH_APP_INSTALLATION_ID_SOURCE: ${{ secrets.RB_GH_APP_INSTALLATION_ID != '' && 'secret' || (vars.RB_GH_APP_INSTALLATION_ID != '' && 'vars' || 'missing') }}
          RB_GH_APP_PRIVATE_KEY: ${{ secrets.RB_GH_APP_PRIVATE_KEY }}
          RB_GH_APP_PRIVATE_KEY_PATH: ${{ vars.RB_GH_APP_PRIVATE_KEY_PATH }}
          RB_GH_APP_WEBHOOK_SECRET: ${{ secrets.RB_GH_APP_WEBHOOK_SECRET }}
          RB_GH_APP_REPOSITORY_SELECTION: ${{ vars.RB_GH_APP_REPOSITORY_SELECTION }}
          RB_GH_APP_SELECTED_REPOS: ${{ vars.RB_GH_APP_SELECTED_REPOS }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          from pathlib import Path

          def norm(v):
              return str(v or "").strip()

          def split_csv(v):
              return [x.strip() for x in str(v or "").split(",") if x.strip()]

          def read_text(path: Path, limit: int = 12000) -> str:
              try:
                  return path.read_text(encoding="utf-8")[:limit]
              except UnicodeDecodeError:
                  try:
                      return path.read_text(encoding="utf-8-sig")[:limit]
                  except Exception:
                      return ""
              except Exception:
                  return ""

          def collapse_ws(text: str) -> str:
              return re.sub(r"\s+", " ", norm(text))

          def truncate(text: str, limit: int = 220) -> str:
              text = collapse_ws(text)
              if len(text) <= limit:
                  return text
              cut = text[: limit - 1].rstrip()
              if " " in cut:
                  cut = cut.rsplit(" ", 1)[0]
              return cut + "вЂ¦"

          def extract_readme_summary(repo_root: Path) -> str:
              for candidate in ("README.md", "README.rst", "README.txt", "readme.md"):
                  path = repo_root / candidate
                  if not path.exists():
                      continue
                  text = read_text(path)
                  if not text:
                      continue
                  lines = [line.strip() for line in text.splitlines()]
                  cleaned = []
                  for line in lines:
                      if not line:
                          continue
                      if line.startswith("#"):
                          continue
                      if re.match(r"^[=\-]{3,}$", line):
                          continue
                      if line.startswith(("![", "[!")):
                          continue
                      cleaned.append(line)
                      if len(cleaned) >= 4:
                          break
                  if cleaned:
                      return truncate(" ".join(cleaned), 260)
              return ""

          def extract_manifest_summary(repo_root: Path) -> str:
              package_json = repo_root / "package.json"
              if package_json.exists():
                  try:
                      payload = json.loads(read_text(package_json, 24000) or "{}")
                      bits = []
                      if payload.get("name"):
                          bits.append(f"package `{payload['name']}`")
                      if payload.get("description"):
                          bits.append(truncate(str(payload["description"]), 180))
                      scripts = payload.get("scripts") or {}
                      if isinstance(scripts, dict) and scripts:
                          script_names = ", ".join(list(scripts.keys())[:4])
                          bits.append(f"scripts: {script_names}")
                      if bits:
                          return "; ".join(bits)
                  except Exception:
                      pass

              pyproject = repo_root / "pyproject.toml"
              if pyproject.exists():
                  text = read_text(pyproject)
                  name = ""
                  desc = ""
                  for line in text.splitlines():
                      stripped = line.strip()
                      if not name and stripped.startswith("name ="):
                          name = stripped.split("=", 1)[1].strip().strip("\"'")
                      if not desc and stripped.startswith("description ="):
                          desc = stripped.split("=", 1)[1].strip().strip("\"'")
                      if name and desc:
                          break
                  bits = []
                  if name:
                      bits.append(f"package `{name}`")
                  if desc:
                      bits.append(truncate(desc, 180))
                  if bits:
                      return "; ".join(bits)

              go_mod = repo_root / "go.mod"
              if go_mod.exists():
                  text = read_text(go_mod)
                  first = next((line.strip() for line in text.splitlines() if line.strip().startswith("module ")), "")
                  if first:
                      return f"Go module `{first.split(None, 1)[1]}`"
              return ""

          def summarize_components(repo_root: Path) -> list[str]:
              interesting_dirs = []
              interesting_files = []
              ignore_dirs = {
                  ".git", ".github", ".venv", "node_modules", "__pycache__", "dist",
                  "build", "coverage", ".pytest_cache", ".ruff_cache"
              }
              for child in sorted(repo_root.iterdir(), key=lambda p: p.name.lower()):
                  name = child.name
                  if child.is_dir():
                      if name in ignore_dirs or name.startswith("."):
                          continue
                      interesting_dirs.append(name)
                  elif child.is_file():
                      if name.lower().startswith("readme"):
                          continue
                      if name in {"package.json", "pyproject.toml", "go.mod", "Cargo.toml", "Dockerfile", "Makefile"}:
                          interesting_files.append(name)
              items = interesting_dirs[:5] + interesting_files[:3]
              return items[:6]

          def load_pr_context() -> dict:
              path = Path("artifacts/pr_context.json")
              if not path.exists():
                  return {}
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {}

          def summarize_pr(pr_context: dict) -> tuple[str, list[str]]:
              pull = pr_context.get("pull_request") or {}
              title = collapse_ws(pull.get("title", ""))
              body = truncate(pull.get("body", ""), 220)
              file_entries = pull.get("files") or []
              files = [norm(entry.get("filename")) for entry in file_entries if norm(entry.get("filename"))]
              summary_bits = []
              if title:
                  summary_bits.append(title)
              if body:
                  summary_bits.append(body)
              if pull.get("changed_files"):
                  summary_bits.append(f"changed files: {pull.get('changed_files')}")
              return " ".join(summary_bits).strip(), files

          def extract_changed_file_count(pr_context: dict, pr_files: list[str]) -> int:
              pull = pr_context.get("pull_request") or {}
              count = int(pull.get("changed_files") or 0)
              if count > 0:
                  return count
              return len(pr_files)

          def extract_pr_file_entries(pr_context: dict) -> list[dict]:
              pull = pr_context.get("pull_request") or {}
              entries = pull.get("files") or []
              return [entry for entry in entries if isinstance(entry, dict) and norm(entry.get("filename"))]

          def format_changed_files(pr_files: list[str], total_count: int = 0) -> str:
              if not pr_files:
                  return ""
              visible = pr_files[:4]
              text = ", ".join(f"`{name}`" for name in visible)
              extra = max(total_count or len(pr_files), len(pr_files)) - len(visible)
              if extra > 0:
                  text += f" (+{extra} more)"
              return text

          def infer_change_areas(pr_files: list[str]) -> list[str]:
              areas = []
              lowered = [norm(name).lower() for name in pr_files if norm(name)]
              for name in lowered:
                  suffix = Path(name).suffix.lower()
                  parts = [part for part in name.split("/") if part]
                  top = parts[0] if parts else ""
                  joined = f"/{name}/"

                  def add(area: str):
                      if area not in areas:
                          areas.append(area)

                  if suffix in {".md", ".rst", ".txt"} or top == "docs" or "/docs/" in joined:
                      add("docs")
                  if top in {"src", "app", "lib"} or suffix in {".py", ".js", ".ts", ".tsx", ".jsx", ".go", ".rs", ".java", ".rb"}:
                      add("src")
                  if "test" in parts or top in {"tests", "__tests__"} or ".spec." in name or ".test." in name:
                      add("tests")
                  if top == ".github" or "/.github/workflows/" in joined:
                      add("CI")
                  if (
                      suffix in {".yml", ".yaml", ".json", ".toml", ".ini"} or
                      "config" in parts or
                      top in {"config", "configs", "settings"}
                  ):
                      add("config")
                  if (
                      top in {"infra", "deploy", "ops"} or
                      any(token in name for token in ("docker", "compose", "terraform", "deploy"))
                  ):
                      add("infra")
                  if Path(name).name in {"package.json", "pyproject.toml", "go.mod", "cargo.toml", "requirements.txt", "poetry.lock"}:
                      add("manifest")
                  if any(token in name for token in ("trial", "validation", "smoke")):
                      add("validation")
              return areas[:4]

          def format_change_areas(change_areas: list[str]) -> str:
              if not change_areas:
                  return ""
              return " / ".join(change_areas)

          def is_artifact_like(name: str) -> bool:
              lowered = norm(name).lower()
              if not lowered:
                  return False
              artifact_tokens = (
                  "artifacts/",
                  "dist/",
                  "build/",
                  "coverage/",
                  "__snapshots__/",
                  ".min.",
                  ".map",
              )
              return any(token in lowered for token in artifact_tokens)

          def discover_guidance_files(repo_root: Path) -> list[Path]:
              found = []
              for rel in [".github/repobrain.instructions.md", "AGENTS.md"]:
                  path = repo_root / rel
                  try:
                      if path.exists() and path.is_file() and not path.is_symlink():
                          found.append(path)
                  except Exception:
                      continue
              return found

          def collect_guidance_lines(paths: list[Path], limit: int = 16) -> list[str]:
              lines = []
              for path in paths:
                  text = read_text(path, 8000)
                  if not text:
                      continue
                  in_code = False
                  for raw in text.splitlines():
                      line = raw.strip()
                      if line.startswith("```"):
                          in_code = not in_code
                          continue
                      if in_code or not line:
                          continue
                      if line.startswith("#"):
                          continue
                      if line.startswith(("- ", "* ")):
                          line = line[2:].strip()
                      if len(line) < 8:
                          continue
                      lines.append(collapse_ws(line))
                      if len(lines) >= limit:
                          return lines
              return lines

          def build_guidance_context(repo_root: Path, pr_files: list[str], change_areas: list[str]) -> dict:
              files = discover_guidance_files(repo_root)
              rel_files = [str(path.relative_to(repo_root)).replace("\\", "/") for path in files]
              lines = collect_guidance_lines(files)
              lowered_lines = [line.lower() for line in lines]
              lowered_files = [norm(name).lower() for name in pr_files if norm(name)]
              lower_areas = [area.lower() for area in change_areas]

              categories = []
              if any(any(token in line for token in ("deploy", "deployment", "config", "environment", "workflow")) for line in lowered_lines):
                  categories.append("deployment/config caution")
              if any(any(token in line for token in ("generated", "autogen", "auto-generated", "do not review generated")) for line in lowered_lines):
                  categories.append("generated-file guidance")
              if any(any(token in line for token in ("test", "tests", "lint", "build", "ci")) for line in lowered_lines):
                  categories.append("build/test hints")
              if any(any(token in line for token in ("auth", "secret", "credential", "sensitive")) for line in lowered_lines):
                  categories.append("sensitive-path attention")
              if any(any(token in line for token in ("small pr", "small prs", "small pull request", "prefer small")) for line in lowered_lines):
                  categories.append("small-pr preference")

              relevant = []
              def add_relevant(text: str):
                  if text and text not in relevant:
                      relevant.append(text)

              for line, low in zip(lines, lowered_lines):
                  if len(relevant) >= 3:
                      break
                  if any(area in {"config", "infra", "manifest", "ci"} for area in lower_areas) and any(token in low for token in ("deploy", "deployment", "config", "environment", "workflow")):
                      add_relevant(line)
                  if any(area in {"docs", "validation"} for area in lower_areas) and any(token in low for token in ("generated", "small pr", "review focus", "docs")):
                      add_relevant(line)
                  if any(area == "tests" for area in lower_areas) and any(token in low for token in ("test", "lint", "build", "ci")):
                      add_relevant(line)
                  if any(token in low for token in ("auth", "secret", "credential", "sensitive")) and any(token in " ".join(lowered_files) for token in ("auth", "secret", "credential", "deploy", "config")):
                      add_relevant(line)

              guidance_summary = ""
              if relevant:
                  guidance_summary = truncate("; ".join(relevant[:2]), 180)
              elif categories:
                  guidance_summary = truncate("repo instructions highlight " + ", ".join(categories[:2]), 180)

              return {
                  "found": bool(rel_files),
                  "files": rel_files,
                  "summary": guidance_summary,
                  "categories": categories[:4],
                  "relevant_hints": relevant[:3],
              }

          def format_guidance_status(guidance: dict) -> str:
              files = guidance.get("files") or []
              if not files:
                  return "not found"
              return "found " + " · ".join(files[:2])

          def collect_bounded_diff_context(pr_context: dict, guidance: dict, limit_files: int = 6, total_char_limit: int = 5000) -> tuple[list[dict], bool]:
              selected = []
              total_chars = 0
              entries = extract_pr_file_entries(pr_context)
              prefer_skip_artifacts = "generated-file guidance" in (guidance.get("categories") or [])
              for entry in entries:
                  filename = norm(entry.get("filename"))
                  patch_excerpt = norm(entry.get("patch_excerpt"))
                  if not filename or not patch_excerpt:
                      continue
                  if prefer_skip_artifacts and is_artifact_like(filename):
                      continue
                  next_total = total_chars + len(patch_excerpt)
                  if selected and next_total > total_char_limit:
                      break
                  selected.append(
                      {
                          "filename": filename,
                          "patch_excerpt": patch_excerpt[:1000],
                      }
                  )
                  total_chars += len(patch_excerpt)
                  if len(selected) >= limit_files or total_chars >= total_char_limit:
                      break
              diff_context_available = bool(selected)
              return selected, diff_context_available

          def build_review_observations(
              pr_summary: str,
              pr_files: list[str],
              change_areas: list[str],
              guidance: dict,
              signal_map: dict,
              patch_entries: list[dict],
              changed_file_count: int,
          ) -> list[str]:
              observations = []
              scope = norm(signal_map.get("scope")).lower() or "unknown"
              change_type = norm(signal_map.get("type")).lower() or "mixed"
              guidance_categories = guidance.get("categories") or []
              guidance_hints = guidance.get("relevant_hints") or []
              change_areas_text = format_change_areas(change_areas)
              has_artifact_files = any(is_artifact_like(name) for name in pr_files)

              if change_areas_text:
                  if scope in {"small", "medium", "large"}:
                      observations.append(
                          f"This PR appears {scope} and {change_type}-oriented based on visible changed files in {change_areas_text}."
                      )
                  else:
                      observations.append(
                          f"Visible changed files cluster around {change_areas_text} in this bounded review."
                      )
              elif pr_files:
                  observations.append(
                      f"This PR appears {scope if scope != 'unknown' else 'limited-scope'} and {change_type}-oriented based on visible changed files."
                  )
              elif pr_summary:
                  observations.append("Visible PR metadata is present, but changed-file context is thin in this bounded review.")

              if "small-pr preference" in guidance_categories and scope == "small":
                  observations.append("Repo guidance prefers small PRs, and this change surface appears small.")
              elif "deployment/config caution" in guidance_categories and any(area.lower() in {"config", "infra", "ci", "manifest"} for area in change_areas):
                  observations.append("Repo guidance marks workflow, config, or deployment-style changes as attention areas here.")
              elif guidance_hints:
                  observations.append(truncate(f"Repo guidance highlight: {guidance_hints[0]}", 170))

              if "generated-file guidance" in guidance_categories and has_artifact_files:
                  observations.append("Repo guidance says generated or artifact files should not drive review focus if they appear in the PR.")

              if patch_entries:
                  filenames = ", ".join(f"`{entry['filename']}`" for entry in patch_entries[:2])
                  observations.append(
                      truncate(
                          f"Small visible diff snippets were available for {filenames}, so this review adds only surface-level observations from limited content context.",
                          175,
                      )
                  )
              else:
                  observations.append("Visible diff/content context is limited here, so deeper conclusions would be out of scope.")

              if not pr_files and not pr_summary:
                  observations.append("This review falls back to sparse visible PR context only.")

              deduped = []
              for item in observations:
                  value = norm(item)
                  if value and value not in deduped:
                      deduped.append(value)
              return deduped[:4]

          def suggest_next_questions(pr_context_available: bool, has_components: bool) -> str:
              options = []
              if pr_context_available:
                  options.append("`/repobrain ask what changed here?`")
                  options.append("`/repobrain ask what is this PR about?`")
              if has_components:
                  options.append("`/repobrain ask what are the main components?`")
              options.append("`/repobrain ask what does this repository do?`")
              deduped = []
              for item in options:
                  if item not in deduped:
                      deduped.append(item)
              return ", ".join(deduped[:3])

          def classify_signal_basis(lowered: str) -> str:
              if "pr" in lowered and any(token in lowered for token in ("about", "change", "changed", "what is this")):
                  return "pr"
              if any(token in lowered for token in ("what changed", "changed here", "files changed", "change here")):
                  return "pr"
              if any(token in lowered for token in ("what does this repository do", "purpose of this repository", "what is this repository", "what does this repo do", "repository do", "main components", "components", "main modules", "structure")):
                  return "repository"
              if any(token in lowered for token in ("repository", "repo")) and any(token in lowered for token in ("pr", "change", "changed")):
                  return "mixed"
              return "mixed"

          def infer_signal_scope(pr_context: dict, component_names: list[str]) -> str:
              pull = pr_context.get("pull_request") or {}
              changed_files = int(pull.get("changed_files") or 0)
              if changed_files:
                  if changed_files <= 3:
                      return "small"
                  if changed_files <= 10:
                      return "medium"
                  return "large"
              if len(component_names) >= 5:
                  return "medium"
              if component_names:
                  return "small"
              return "unknown"

          def infer_signal_type(pr_files: list[str], manifest_summary: str, component_names: list[str]) -> str:
              files = [name.lower() for name in pr_files if norm(name)]
              if not files:
                  if manifest_summary:
                      return "app"
                  if any(name.lower() in {"infra", "deploy", "ops"} for name in component_names):
                      return "infra"
                  return "mixed"

              docs_like = all(
                  name.endswith((".md", ".rst", ".txt")) or "/docs/" in f"/{name}/" or name.startswith("docs/")
                  for name in files
              )
              config_like = all(
                  name.endswith((".yml", ".yaml", ".json", ".toml", ".ini")) or
                  any(token in name for token in ("docker", "compose", ".github/workflows", "config"))
                  for name in files
              )
              infra_hits = sum(
                  1 for name in files
                  if any(token in name for token in ("docker", "compose", ".github/workflows", "deploy", "terraform", "infra"))
              )
              test_hits = sum(
                  1 for name in files
                  if any(token in name for token in ("/tests/", "/test/", ".spec.", ".test.")) or name.startswith("tests/")
              )
              manifest_hits = sum(
                  1 for name in files
                  if Path(name).name in {"package.json", "pyproject.toml", "go.mod", "cargo.toml", "requirements.txt", "poetry.lock"}
              )
              code_hits = sum(
                  1 for name in files
                  if name.endswith((".py", ".js", ".ts", ".tsx", ".jsx", ".go", ".rs", ".java", ".rb"))
              )

              if docs_like:
                  return "docs"
              if test_hits and test_hits == len(files):
                  return "tests"
              if manifest_hits and manifest_hits == len(files):
                  return "config"
              if config_like and not code_hits:
                  return "config"
              if infra_hits and not code_hits:
                  return "infra"
              if infra_hits and code_hits:
                  return "mixed"
              if code_hits:
                  return "feature"
              return "mixed"

          def infer_repository_type(manifest_summary: str, component_names: list[str]) -> str:
              manifest = manifest_summary.lower()
              names = [name.lower() for name in component_names]
              if manifest:
                  return "app"
              if any(name in {"infra", "deploy", "ops"} for name in names):
                  return "infra"
              if any(name in {"config", "configs", "settings"} for name in names):
                  return "config"
              if names:
                  return "app"
              return "mixed"

          def infer_signal_context_strength(
              readme_summary: str,
              manifest_summary: str,
              pr_summary: str,
              pr_files: list[str],
              component_names: list[str],
              basis: str = "mixed",
          ) -> str:
              score = 0
              if readme_summary:
                  score += 2
              if manifest_summary:
                  score += 1
              if pr_summary and basis in {"pr", "mixed"}:
                  score += 2
              if pr_files and basis in {"pr", "mixed"}:
                  score += 1
              if component_names:
                  score += 1
              if score >= 5:
                  return "strong"
              if score >= 3:
                  return "moderate"
              return "weak"

          def render_compact_answer(
              query: str,
              summary: str,
              details: list[tuple[str, str]] | None = None,
              signal_lines: list[tuple[str, str]] | None = None,
              note: str = "",
              next_question: str = "",
          ) -> str:
              lines = [
                  "## RepoBrain Ask",
                  f"Question: {query}",
                  f"Answer: {truncate(summary, 300)}",
              ]
              compact_signal = [(label, norm(value)) for label, value in (signal_lines or []) if norm(value)]
              if compact_signal:
                  lines.append(f"Signal: {format_signal_inline(compact_signal)}")
              compact_details = [(label, norm(value)) for label, value in (details or []) if norm(value)]
              if compact_details:
                  for label, value in compact_details:
                      lines.append(f"{label}: {truncate(value, 260)}")
              if norm(note):
                  lines.append(f"Note: {truncate(note, 240)}")
              if norm(next_question):
                  lines.append(f"Next safe step: {truncate(next_question, 240)}")
              return "\n".join(lines)

          def format_signal_inline(signal_lines: list[tuple[str, str]] | None = None) -> str:
              compact_signal = [(label, norm(value)) for label, value in (signal_lines or []) if norm(value)]
              if not compact_signal:
                  return ""
              return " · ".join(f"{label}={truncate(value, 40)}" for label, value in compact_signal)

          def infer_host_display(workflow_ref: str) -> str:
              value = norm(workflow_ref)
              if not value:
                  return "repobrain-community@main"
              ref = value
              if "@" in ref:
                  ref = ref.split("@", 1)[1]
              ref = ref.replace("refs/heads/", "").replace("refs/tags/", "")
              return f"repobrain-community@{ref or 'main'}"

          def build_signal_lines(
              basis: str,
              readme_summary: str,
              manifest_summary: str,
              pr_summary: str,
              pr_files: list[str],
              component_names: list[str],
              pr_context: dict,
          ) -> list[tuple[str, str]]:
              if basis == "repository":
                  return [
                      ("basis", "repository"),
                      ("type", infer_repository_type(manifest_summary, component_names)),
                      ("context", infer_signal_context_strength(readme_summary, manifest_summary, pr_summary, pr_files, component_names, basis="repository")),
                  ]
              if basis == "pr":
                  return [
                      ("basis", "PR"),
                      ("scope", infer_signal_scope(pr_context, component_names)),
                      ("type", infer_signal_type(pr_files, manifest_summary, component_names)),
                      ("context", infer_signal_context_strength(readme_summary, manifest_summary, pr_summary, pr_files, component_names, basis="pr")),
                  ]
              return [
                  ("basis", "mixed"),
                  ("type", infer_signal_type(pr_files, manifest_summary, component_names) if pr_files else infer_repository_type(manifest_summary, component_names)),
                  ("context", infer_signal_context_strength(readme_summary, manifest_summary, pr_summary, pr_files, component_names, basis="mixed")),
              ]

          def render_review_v1(
              pr_summary: str,
              signal_lines: list[tuple[str, str]],
              files_text: str,
              change_areas_text: str = "",
              guidance_text: str = "",
              observations: list[str] | None = None,
              review_context_limited: bool = False,
              next_question: str = "",
          ) -> str:
              summary_text = pr_summary or "Visible PR context is limited, so this bounded review stays close to sparse PR metadata only."
              lines = [
                  "## RepoBrain Review",
                  f"PR Summary: {truncate(summary_text, 300)}",
              ]
              signal_text = format_signal_inline(signal_lines)
              if signal_text:
                  lines.append(f"Signal: {signal_text}")
              if norm(files_text):
                  lines.append(f"Changed files: {truncate(files_text, 260)}")
              if norm(change_areas_text):
                  lines.append(f"Change areas: {truncate(change_areas_text, 180)}")
              if norm(guidance_text):
                  lines.append(f"Guidance: {truncate(guidance_text, 180)}")
              review_observations = [truncate(item, 185) for item in (observations or []) if norm(item)]
              if review_observations:
                  lines.append("Review observations:")
                  for item in review_observations[:4]:
                      lines.append(f"- {item}")
              if review_context_limited:
                  lines.append("Bounded limits: read-only review; visible diff/content context is limited; no fix generation or security verdict.")
              else:
                  lines.append("Bounded limits: read-only review; no fix generation; no security verdict.")
              if norm(next_question):
                  lines.append(f"Next safe step: {truncate(next_question, 220)}")
              return "\n".join(lines)

          def render_doctor_card(
              workflow_ref: str,
              workflow_path: str,
              event_name: str,
              guidance_status: str,
          ) -> str:
              lines = [
                  "## RepoBrain Doctor",
                  "Status: connected",
                  "Surface: external GitHub foundation",
                  f"Host: {infer_host_display(workflow_ref)}",
                  f"Workflow: {workflow_path or '.github/workflows/repobrain.yml'}",
                  f"Event: {event_name or 'unknown'}",
                  f"Guidance: {guidance_status}",
                  "Supported: help · doctor · ask · review",
                  "Unsupported: fix",
                  "Setup notes:",
                  "- one RepoBrain responder is expected",
                  "- Surface supports bounded read-only Review v1",
                  "- answers use visible repo/PR context only",
                  "- if duplicate comments appear, check that only one workflow listens to `/repobrain` issue_comment",
                  "Next step: /repobrain ask what is this PR about?",
              ]
              return "\n".join(lines)

          def answer_repo_aware(query: str, repository: str, repo_root: Path, pr_context: dict) -> str:
              lowered = query.lower()
              readme_summary = extract_readme_summary(repo_root)
              manifest_summary = extract_manifest_summary(repo_root)
              component_names = summarize_components(repo_root)
              pr_summary, pr_files = summarize_pr(pr_context)
              repo_name = repository.split("/")[-1] if repository else repo_root.name

              purpose_text = readme_summary or manifest_summary
              if not purpose_text and component_names:
                  purpose_text = f"`{repo_name}` appears to center on {', '.join(f'`{name}`' for name in component_names[:3])} based on a bounded top-level scan."
              if not purpose_text and pr_summary:
                  purpose_text = f"`{repo_name}` has limited repository metadata in the bounded scan; the clearest available signal comes from the current PR."
              if not purpose_text:
                  purpose_text = f"`{repo_name}` has limited descriptive metadata in the bounded external path."

              manifest_text = manifest_summary or ""
              components_text = ", ".join(f"`{name}`" for name in component_names) if component_names else ""
              changed_file_count = extract_changed_file_count(pr_context, pr_files)
              files_text = format_changed_files(pr_files, changed_file_count)
              change_areas = infer_change_areas(pr_files)
              change_areas_text = format_change_areas(change_areas)
              guidance = build_guidance_context(repo_root, pr_files, change_areas)
              weak_context = not readme_summary and not manifest_summary
              pr_context_available = bool(pr_context.get("is_pull_request"))
              next_questions = suggest_next_questions(pr_context_available, bool(component_names))
              basis = classify_signal_basis(lowered)
              signal_lines = build_signal_lines(
                  basis,
                  readme_summary,
                  manifest_summary,
                  pr_summary,
                  pr_files,
                  component_names,
                  pr_context,
              )
              weak_context_note = ""
              if weak_context:
                  weak_context_note = "Repository context is limited here, so this answer relies on top-level files and any visible PR metadata."
              guidance_text = guidance.get("summary") or ""

              if "pr" in lowered and any(token in lowered for token in ("about", "change", "changed", "what is this")):
                  pr_line = pr_summary or "PR metadata was not available in the bounded external path."
                  return render_compact_answer(
                      query,
                      pr_line,
                      [("Guidance", guidance_text), ("Changed files", files_text), ("Change areas", change_areas_text)],
                      signal_lines=signal_lines,
                      note="" if pr_summary else "This PR has very little title/body context in the bounded external path.",
                      next_question=next_questions if not pr_summary else "",
                  )

              if any(token in lowered for token in ("what changed", "changed here", "files changed", "change here")):
                  change_line = pr_summary or purpose_text
                  return render_compact_answer(
                      query,
                      change_line,
                      [("Guidance", guidance_text), ("Changed files", files_text), ("Change areas", change_areas_text)],
                      signal_lines=signal_lines,
                      note="" if files_text else "Changed-file context is limited, so the summary falls back to the best repository signal available.",
                      next_question=next_questions if not files_text else "",
                  )

              if any(token in lowered for token in ("pay attention", "watch", "watch out", "careful", "caution", "focus on")):
                  attention_summary = guidance_text or (
                      f"This PR mainly touches {change_areas_text} in the bounded external view."
                      if change_areas_text
                      else "Visible PR context is limited, so there is no strong repo-specific attention hint yet."
                  )
                  return render_compact_answer(
                      query,
                      attention_summary,
                      [("Guidance", guidance_text), ("Changed files", files_text), ("Change areas", change_areas_text)],
                      signal_lines=signal_lines,
                      note="" if guidance_text else "No repo guidance file matched this PR strongly, so this answer falls back to visible PR context only.",
                      next_question=next_questions if not guidance_text else "",
                  )

              if any(token in lowered for token in ("main components", "components", "main modules", "structure")):
                  return render_compact_answer(
                      query,
                      f"Main visible components center on {components_text or 'a small set of top-level files that do not expose strong component boundaries yet'}.",
                      [
                          ("Repository summary", truncate(purpose_text, 220)),
                      ],
                      signal_lines=signal_lines,
                      note=weak_context_note if weak_context else "",
                      next_question=next_questions if weak_context else "",
                  )

              if any(token in lowered for token in ("what does this repository do", "purpose of this repository", "what is this repository", "what does this repo do", "repository do")):
                  details = []
                  if manifest_text:
                      details.append(("Manifest signal", truncate(manifest_text, 220)))
                  if components_text:
                      details.append(("Main visible components", components_text))
                  return render_compact_answer(
                      query,
                      purpose_text,
                      details,
                      signal_lines=signal_lines,
                      note=weak_context_note if weak_context else "",
                      next_question=next_questions if weak_context else "",
                  )

              vague_query = len(query.split()) <= 4 and not any(token in lowered for token in ("repository", "repo", "pr", "change", "component", "purpose"))
              return render_compact_answer(
                  query,
                  purpose_text,
                  [
                      ("Guidance", guidance_text),
                      ("Relevant context", truncate(pr_summary, 180) if pr_summary else ""),
                      ("Change areas", change_areas_text),
                  ],
                  signal_lines=signal_lines,
                  note=weak_context_note if weak_context else ("This is a bounded quick answer; a more specific question usually produces a sharper result." if vague_query else ""),
                  next_question=next_questions if (weak_context or vague_query) else "",
              )

          def reason_for_status(overall_status: str, fail_codes: set[str]):
              if overall_status == "READY":
                  return "ready_all_prereqs_satisfied", "All required GitHub App onboarding prerequisites are satisfied."
              if overall_status == "UNSUPPORTED_SETUP":
                  if "runtime_event_unsupported" in fail_codes:
                      return "unsupported_runtime_event", "Runtime event is unsupported for onboarding validation."
                  if "repository_selection_mode_invalid" in fail_codes:
                      return "unsupported_repository_selection_mode", "Repository selection mode is invalid."
                  if "selected_repositories_repo_not_allowed" in fail_codes:
                      return "selected_repo_binding_mismatch", "Current repository is not included in selected-repository rollout allowlist."
                  if "workflow_issue_comment_missing" in fail_codes:
                      return "issue_comment_trigger_missing", "Workflow does not expose issue_comment trigger required for command flow."
                  if "workflow_file_missing" in fail_codes:
                      return "workflow_file_missing", "RepoBrain workflow file is missing or unresolved."
                  return "unsupported_setup_detected", "Unsupported setup topology detected."
              if overall_status == "MISSING_PERMISSION":
                  return "workflow_permissions_missing", "Workflow permissions are missing or weaker than required."
              if overall_status == "MISSING_CONFIG":
                  if "github_app_id_missing" in fail_codes:
                      return "github_app_id_missing", "GitHub App ID is missing."
                  if "github_app_id_invalid" in fail_codes:
                      return "github_app_id_invalid", "GitHub App ID format is invalid."
                  if "github_app_installation_id_missing" in fail_codes:
                      return "github_app_installation_id_missing", "GitHub App installation ID is missing."
                  if "github_app_installation_id_invalid" in fail_codes:
                      return "github_app_installation_id_invalid", "GitHub App installation ID format is invalid."
                  if "github_app_private_key_missing" in fail_codes:
                      return "github_app_private_key_missing", "GitHub App private key is missing."
                  if "selected_repositories_missing" in fail_codes:
                      return "selected_repositories_missing", "Selected repositories allowlist is missing."
                  return "missing_config_detected", "Configuration prerequisites are missing."
              return "unknown_status", "Readiness status could not be classified."

          comment_text = norm(os.getenv("COMMENT_TEXT"))
          cmd = norm(os.getenv("COMMAND")).lower() or "help"
          supported = norm(os.getenv("SUPPORTED")) == "1"
          issue_number = norm(os.getenv("ISSUE_NUMBER"))
          dry_run = norm(os.getenv("DRY_RUN")).lower() == "true"

          query = ""
          if cmd == "ask":
              m = re.match(r"^\s*/repobrain(?:\s+[a-zA-Z_-]+)?\s*(.*)$", comment_text, flags=re.IGNORECASE | re.DOTALL)
              query = norm(m.group(1) if m else "")

          if not supported:
              status = "blocked"
              decision = "UNSUPPORTED_COMMAND"
              body = (
                  "RepoBrain external GitHub mode foundation currently supports `/repobrain help`, `/repobrain doctor`, `/repobrain ask`, and bounded `/repobrain review`.\n"
                  f"Received: `/repobrain {cmd}`.\n"
                  "This bounded behavior is intentional for the current external GitHub foundation stage."
              )
          elif cmd == "help":
              status = "success"
              decision = "HELP"
              body = (
                  "## RepoBrain External GitHub Foundation\n"
                  "Supported now:\n"
                  "- `/repobrain help`\n"
                  "- `/repobrain doctor`\n"
                  "- `/repobrain ask <question>`\n"
                  "- `/repobrain review` - bounded read-only Review v1\n\n"
                  "Use `/repobrain doctor` to verify the external setup surface.\n\n"
                  "Best first questions:\n"
                  "- `/repobrain ask what does this repository do?`\n"
                  "- `/repobrain ask what is this PR about?`\n"
                  "- `/repobrain ask what changed here?`\n\n"
                  "Repo guidance:\n"
                  "- RepoBrain can use `.github/repobrain.instructions.md` or `AGENTS.md` when present\n\n"
                  "Signal layer:\n"
                  "- ask and review responses include short bounded signals for scope, type, and context strength\n- review keeps changed files, change areas, and bounded observations near the top for fast triage\n\n"
                  "Unsupported (explicitly blocked):\n"
                  "- `/repobrain fix`\n\n"
                  "Bounded behavior note:\n"
                  "- answers use visible repo and PR context only\n"
                  "- review is read-only and based on bounded visible PR context only\n"
                  "- review does not generate fixes or claim full review parity\n"
                  "- when that context is thin, RepoBrain will say so and suggest a sharper next question\n"
              )
          elif cmd == "doctor":
              status = "success"
              decision = "DOCTOR"
          elif cmd == "review":
              status = "success"
              decision = "REVIEW_V1"
          elif not query:
              status = "blocked"
              decision = "ASK_QUERY_MISSING"
              body = (
                  "RepoBrain ask request is missing a question.\n"
                  "Usage: `/repobrain ask <question>`\n"
                  "Try: `/repobrain ask what does this repository do?`"
              )
          else:
              status = "success"
              decision = "ANSWER"

          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          repository = norm(os.getenv("GITHUB_REPOSITORY"))
          event_name = norm(os.getenv("CALLER_EVENT_NAME"))
          ref = norm(os.getenv("GITHUB_REF"))
          sha = norm(os.getenv("GITHUB_SHA"))
          run_id = norm(os.getenv("GITHUB_RUN_ID"))
          run_attempt = norm(os.getenv("GITHUB_RUN_ATTEMPT"))
          workflow_ref = norm(os.getenv("GITHUB_WORKFLOW_REF"))
          workflow_sha = norm(os.getenv("GITHUB_WORKFLOW_SHA"))
          workflow_path = norm(os.getenv("WORKFLOW_PATH")) or ".github/workflows/repobrain_external.yml"
          repo_root = Path.cwd()
          pr_context = load_pr_context()
          readme_summary_for_review = extract_readme_summary(repo_root)
          manifest_summary_for_review = extract_manifest_summary(repo_root)
          component_names_for_review = summarize_components(repo_root)
          pr_summary_for_audit, pr_files_for_audit = summarize_pr(pr_context)
          review_changed_file_count = extract_changed_file_count(pr_context, pr_files_for_audit)
          review_change_areas = infer_change_areas(pr_files_for_audit)
          guidance_context = build_guidance_context(repo_root, pr_files_for_audit, review_change_areas)
          review_patch_entries, diff_context_available = collect_bounded_diff_context(pr_context, guidance_context)
          review_signal_lines = build_signal_lines(
              "pr",
              readme_summary_for_review,
              manifest_summary_for_review,
              pr_summary_for_audit,
              pr_files_for_audit,
              component_names_for_review,
              pr_context,
          ) if supported and cmd == "review" else []
          review_signal_map = {label: value for label, value in review_signal_lines}
          review_observations = build_review_observations(
              pr_summary_for_audit,
              pr_files_for_audit,
              review_change_areas,
              guidance_context,
              review_signal_map,
              review_patch_entries,
              review_changed_file_count,
          ) if supported and cmd == "review" else []
          review_context_limited = bool(
              supported
              and cmd == "review"
              and (
                  not diff_context_available
                  or review_changed_file_count > len(review_patch_entries)
              )
          )

          if supported and cmd == "ask" and query:
              body = answer_repo_aware(query, repository, repo_root, pr_context)
          elif supported and cmd == "doctor":
              body = render_doctor_card(workflow_ref, workflow_path, event_name, format_guidance_status(guidance_context))
          elif supported and cmd == "review":
              files_text = format_changed_files(pr_files_for_audit, review_changed_file_count)
              change_areas_text = format_change_areas(review_change_areas)
              review_guidance = guidance_context.get("summary") or ""
              body = render_review_v1(
                  pr_summary_for_audit,
                  review_signal_lines,
                  files_text,
                  change_areas_text=change_areas_text,
                  guidance_text=review_guidance,
                  observations=review_observations,
                  review_context_limited=review_context_limited,
                  next_question="`/repobrain ask what changed here?`",
              )

          Path("artifacts/audit").mkdir(parents=True, exist_ok=True)
          Path("artifacts/evidence_pack").mkdir(parents=True, exist_ok=True)
          Path("artifacts/onboarding").mkdir(parents=True, exist_ok=True)

          audit = {
              "external_foundation_contract_version": "external_github_foundation_v1",
              "mode": "external_github_foundation",
              "status": status,
              "decision": decision,
              "command": cmd,
              "supported": bool(supported),
              "query": query,
              "answer_mode": (
                  "repo_aware_compact_v1" if (supported and cmd == "ask" and query)
                  else "doctor_setup_health_v1" if (supported and cmd == "doctor")
                  else "review_v1_read_only" if (supported and cmd == "review")
                  else "bounded_foundation_v1"
              ),
              "bounded_scope": {
                  "supported_commands": ["help", "doctor", "ask", "review"],
                  "unsupported_commands": ["fix"],
              },
              "context_summary": {
                  "pr_context_available": bool(pr_context.get("is_pull_request")),
                  "readme_present": any((repo_root / candidate).exists() for candidate in ("README.md", "README.rst", "README.txt", "readme.md")),
                  "manifest_present": any((repo_root / candidate).exists() for candidate in ("package.json", "pyproject.toml", "go.mod")),
              },
              "guidance_summary": {
                  "guidance_found": bool(guidance_context.get("found")),
                  "guidance_files": guidance_context.get("files") or [],
                  "guidance_categories": guidance_context.get("categories") or [],
                  "guidance_summary": guidance_context.get("summary") or "",
              },
              "triage_summary": {
                  "output_mode": "review_v1_read_only" if (supported and cmd == "review") else "n/a",
                  "changed_file_count": review_changed_file_count if (supported and cmd == "review") else 0,
                  "changed_files_sample": pr_files_for_audit[:4] if (supported and cmd == "review") else [],
                  "change_areas": review_change_areas if (supported and cmd == "review") else [],
                  "guidance_found": bool(guidance_context.get("found")) if (supported and cmd == "review") else False,
                  "guidance_files": (guidance_context.get("files") or []) if (supported and cmd == "review") else [],
                  "review_context_limited": review_context_limited if (supported and cmd == "review") else False,
                  "review_observation_count": len(review_observations) if (supported and cmd == "review") else 0,
                  "diff_context_available": diff_context_available if (supported and cmd == "review") else False,
                  "signal": review_signal_map if (supported and cmd == "review") else {},
                  "event_name": event_name or "n/a",
                  "workflow_path": workflow_path,
                  "run_id": run_id or "n/a",
                  "generated_at_utc": now,
              },
              "runtime_provenance": {
                  "repository": repository,
                  "event_name": event_name,
                  "ref": ref,
                  "sha": sha,
                  "workflow_ref": workflow_ref,
                  "workflow_sha": workflow_sha,
                  "run_id": run_id,
                  "run_attempt": run_attempt,
              },
              "generated_at_utc": now,
          }
          issue_tag = issue_number.lstrip("#") if issue_number else "na"
          audit_path = Path(f"artifacts/audit/audit_external_foundation_{run_id}_{issue_tag}.json")
          audit_path.write_text(json.dumps(audit, indent=2), encoding="utf-8")

          diagnostic_md = (
              "# RepoBrain Diagnostic Summary (External Foundation)\n\n"
              f"- Status: `{status}`\n"
              f"- Decision: `{decision}`\n"
              f"- Command: `{cmd}`\n"
              f"- Supported: `{'yes' if supported else 'no'}`\n"
              f"- Event: `{event_name or 'n/a'}`\n"
          )
          Path("artifacts/diagnostic_summary.md").write_text(diagnostic_md, encoding="utf-8")

          evidence_public = {
              "evidence_pack_version": "tkya_evidence_pack_v1_public_safe",
              "mode": "external_github_foundation",
              "status": status,
              "decision": decision,
              "command": cmd,
              "bounded_scope": audit["bounded_scope"],
              "guidance_summary": audit["guidance_summary"],
              "triage_summary": audit["triage_summary"] if (supported and cmd == "review") else {},
              "runtime_provenance": audit["runtime_provenance"],
              "generated_at_utc": now,
          }
          evidence_internal = {
              **evidence_public,
              "contract": {
                  "execution_profile_requested": "balanced",
                  "execution_profile_used": "balanced",
                  "policy_outcome": "default_balanced",
              },
          }
          Path("artifacts/evidence_pack/repobrain_tkya_evidence_pack_public_safe.json").write_text(
              json.dumps(evidence_public, indent=2), encoding="utf-8"
          )
          Path("artifacts/evidence_pack/repobrain_tkya_evidence_pack_internal.json").write_text(
              json.dumps(evidence_internal, indent=2), encoding="utf-8"
          )
          evidence_md = (
              "# RepoBrain TKYA Evidence Pack (External Foundation)\n\n"
              f"- Status: `{status}`\n"
              f"- Decision: `{decision}`\n"
              f"- Command: `{cmd}`\n"
              "- Supported scope: `help`, `doctor`, `ask`, `review`\n"
              "- Unsupported scope: `fix`\n"
          )
          Path("artifacts/evidence_pack/repobrain_tkya_evidence_pack.md").write_text(evidence_md, encoding="utf-8")

          required_permissions = {
              "contents": "read",
              "issues": "write",
              "pull-requests": "write",
              "checks": "write",
              "statuses": "read",
              "actions": "read",
          }
          perm_level = {"none": 0, "read": 1, "write": 2, "write-all": 3}

          checks = []
          next_steps = []

          def add(code, status_v, category, message, next_step):
              checks.append(
                  {
                      "code": code,
                      "status": status_v,
                      "category": category,
                      "message": message,
                      "next_step": next_step,
                  }
              )
              if status_v == "FAIL" and next_step:
                  next_steps.append(next_step)

          if event_name in {"", "issue_comment", "workflow_dispatch"}:
              add("runtime_event_supported", "PASS", "runtime", f"Runtime event is supported (`{event_name or 'local/manual'}`).", "Proceed with readiness checks.")
          else:
              add("runtime_event_unsupported", "FAIL", "unsupported_setup", f"Unsupported runtime event (`{event_name}`).", "Use `issue_comment` or `workflow_dispatch` context.")

          app_id = norm(os.getenv("RB_GH_APP_ID"))
          app_id_source = norm(os.getenv("RB_GH_APP_ID_SOURCE")).lower() or ("env" if app_id else "missing")
          inst_id = norm(os.getenv("RB_GH_APP_INSTALLATION_ID"))
          inst_source = norm(os.getenv("RB_GH_APP_INSTALLATION_ID_SOURCE")).lower() or ("env" if inst_id else "missing")
          private_key_inline = norm(os.getenv("RB_GH_APP_PRIVATE_KEY"))
          private_key_path = norm(os.getenv("RB_GH_APP_PRIVATE_KEY_PATH"))
          private_key_path_exists = bool(private_key_path and Path(private_key_path).exists())
          private_key_present = bool(private_key_inline or private_key_path_exists)
          webhook_secret = norm(os.getenv("RB_GH_APP_WEBHOOK_SECRET"))
          repo_mode = norm(os.getenv("RB_GH_APP_REPOSITORY_SELECTION") or "selected").lower()
          selected_repos = split_csv(os.getenv("RB_GH_APP_SELECTED_REPOS"))
          selected_set = {r.lower() for r in selected_repos}
          current_repo = repository.lower()

          if repo_mode not in {"selected", "all"}:
              add("repository_selection_mode_invalid", "FAIL", "unsupported_setup", f"Invalid repository selection mode (`{repo_mode}`).", "Set `RB_GH_APP_REPOSITORY_SELECTION` to `selected` or `all`.")
          else:
              add("repository_selection_mode_valid", "PASS", "config", f"Repository selection mode is `{repo_mode}`.", "Keep selected rollout where possible.")
              if repo_mode == "selected":
                if not selected_repos:
                    add("selected_repositories_missing", "FAIL", "missing_config", "Selected mode requires `RB_GH_APP_SELECTED_REPOS`.", "Set `RB_GH_APP_SELECTED_REPOS` to include target repo.")
                else:
                    add("selected_repositories_configured", "PASS", "config", f"Selected repositories configured (`{len(selected_repos)}`).", "Keep selected-repo rollout explicit.")
                    if current_repo and current_repo not in selected_set:
                        add("selected_repositories_repo_not_allowed", "FAIL", "unsupported_setup", f"Current repository `{current_repo}` is not in selected allowlist.", "Add current repository to selected allowlist.")

          if app_id:
              if app_id.isdigit():
                  add("github_app_id_present", "PASS", "config", "GitHub App ID is configured.", "Keep App ID stable.")
              else:
                  add("github_app_id_invalid", "FAIL", "missing_config", "GitHub App ID format is invalid (expected numeric).", "Set numeric `RB_GH_APP_ID`.")
          else:
              add("github_app_id_missing", "FAIL", "missing_config", "GitHub App ID is missing.", "Set `RB_GH_APP_ID`.")

          if inst_id:
              if inst_id.isdigit():
                  add("github_app_installation_id_present", "PASS", "config", "GitHub App installation ID is configured.", "Keep installation ID aligned with install.")
              else:
                  add("github_app_installation_id_invalid", "FAIL", "missing_config", "GitHub App installation ID format is invalid (expected numeric).", "Set numeric `RB_GH_APP_INSTALLATION_ID`.")
          else:
              add("github_app_installation_id_missing", "FAIL", "missing_config", "GitHub App installation ID is missing.", "Set `RB_GH_APP_INSTALLATION_ID`.")

          if private_key_present:
              add("github_app_private_key_present", "PASS", "config", "GitHub App private key is configured.", "Rotate key regularly.")
          else:
              add("github_app_private_key_missing", "FAIL", "missing_config", "GitHub App private key is missing.", "Set `RB_GH_APP_PRIVATE_KEY` or readable `RB_GH_APP_PRIVATE_KEY_PATH`.")

          if webhook_secret:
              add("github_app_webhook_secret_present", "PASS", "config", "GitHub App webhook secret is configured.", "Keep webhook signature checks enabled.")
          else:
              add("github_app_webhook_secret_missing", "WARN", "missing_config", "GitHub App webhook secret is not configured.", "Set webhook secret before external webhook exposure.")

          workflow_file = Path(workflow_path)
          detected_permissions = {}
          missing_permissions = []
          issue_comment_enabled = False
          if workflow_file.exists():
              text = workflow_file.read_text(encoding="utf-8")
              issue_comment_enabled = "issue_comment:" in text
              for m in re.finditer(r"(?m)^\s{2,}([a-zA-Z-]+)\s*:\s*([a-zA-Z-]+)\s*$", text):
                  k = norm(m.group(1)).lower()
                  v = norm(m.group(2)).lower()
                  if k in required_permissions and v in perm_level:
                      detected_permissions[k] = v
              for k, req in required_permissions.items():
                  found = detected_permissions.get(k, "none")
                  if perm_level.get(found, 0) < perm_level[req]:
                      missing_permissions.append(f"{k}:{req}")
              if missing_permissions:
                  add("workflow_permissions_missing", "FAIL", "missing_permission", "Workflow permissions are missing or too weak.", "Set required workflow permissions in caller workflow.")
              else:
                  add("workflow_permissions_ready", "PASS", "permission", "Workflow permissions satisfy baseline.", "Keep permissions minimal and explicit.")
              if issue_comment_enabled:
                  add("workflow_issue_comment_enabled", "PASS", "workflow", "Caller workflow includes issue_comment trigger.", "Keep trigger restricted to `/repobrain`.")
              else:
                  add("workflow_issue_comment_missing", "FAIL", "unsupported_setup", "Caller workflow does not include issue_comment trigger.", "Add issue_comment trigger in caller workflow.")
          else:
              missing_permissions = [f"{k}:{v}" for k, v in required_permissions.items()]
              add("workflow_file_missing", "FAIL", "unsupported_setup", f"Workflow file not found: `{workflow_path}`.", "Set valid `workflow_path` in reusable workflow call.")

          fail_codes = [c["code"] for c in checks if c["status"] == "FAIL"]
          fail_set = set(fail_codes)
          fail_categories = {c["category"] for c in checks if c["status"] == "FAIL"}
          fail_codes_by_category = {
              "unsupported_setup": sorted(c["code"] for c in checks if c["status"] == "FAIL" and c["category"] == "unsupported_setup"),
              "missing_permission": sorted(c["code"] for c in checks if c["status"] == "FAIL" and c["category"] == "missing_permission"),
              "missing_config": sorted(c["code"] for c in checks if c["status"] == "FAIL" and c["category"] == "missing_config"),
          }
          fail_counts_by_category = {k: len(v) for k, v in fail_codes_by_category.items()}

          if "unsupported_setup" in fail_categories:
              overall_status = "UNSUPPORTED_SETUP"
          elif "missing_permission" in fail_categories:
              overall_status = "MISSING_PERMISSION"
          elif "missing_config" in fail_categories:
              overall_status = "MISSING_CONFIG"
          else:
              overall_status = "READY"

          reason_code, reason_short = reason_for_status(overall_status, fail_set)

          readiness_payload = {
              "readiness_contract_version": "install_readiness_v2",
              "generated_at_utc": now,
              "installation_model": "github_app_first",
              "overall_status": overall_status,
              "status_reason_code": reason_code,
              "status_reason_short": reason_short,
              "ready_for_ask_review_fix": overall_status == "READY",
              "repository_selection_mode": repo_mode,
              "selected_repositories": selected_repos,
              "checks": checks,
              "summary": {
                  "pass": sum(1 for c in checks if c["status"] == "PASS"),
                  "fail": sum(1 for c in checks if c["status"] == "FAIL"),
                  "warn": sum(1 for c in checks if c["status"] == "WARN"),
              },
              "blocking_summary": {
                  "fail_codes": sorted(fail_codes),
                  "fail_codes_by_category": fail_codes_by_category,
                  "fail_counts_by_category": fail_counts_by_category,
              },
              "next_steps": list(dict.fromkeys(next_steps)),
              "workflow_probe": {
                  "workflow_path": workflow_path,
                  "exists": workflow_file.exists(),
                  "issue_comment_enabled": issue_comment_enabled,
                  "required_permissions": required_permissions,
                  "detected_permissions": detected_permissions,
                  "missing_permissions": sorted(missing_permissions),
              },
              "readiness_provenance": {
                  "generation_event_name": event_name or "local/manual",
                  "generation_workflow_path": workflow_path,
                  "generation_ref": ref or "n/a",
                  "generation_sha": sha or "n/a",
                  "generation_ref_kind": "pull_ref" if (ref or "").startswith("refs/pull/") else ("branch_ref" if (ref or "").startswith("refs/heads/") else "unknown"),
                  "generation_workflow_ref": workflow_ref or "n/a",
                  "generation_workflow_sha": workflow_sha or "n/a",
                  "generation_run_id": run_id or "n/a",
                  "generation_run_attempt": run_attempt or "n/a",
                  "generation_job_name": "repobrain_external_foundation",
              },
              "inputs_seen": {
                  "event_name": event_name or "local/manual",
                  "current_repository": current_repo or "n/a",
                  "app_id_present": bool(app_id),
                  "app_id_source": app_id_source,
                  "installation_id_present": bool(inst_id),
                  "installation_id_source": inst_source,
                  "private_key_source": "env_inline" if private_key_inline else ("path" if private_key_path_exists else "missing"),
                  "private_key_path_present": bool(private_key_path),
                  "private_key_path_exists": private_key_path_exists,
                  "private_key_path_readable": private_key_path_exists,
                  "webhook_secret_present": bool(webhook_secret),
                  "selected_repositories_count": len(selected_repos),
              },
          }

          readiness_md = (
              "# RepoBrain GitHub App Install Readiness\n\n"
              f"- Contract version: `{readiness_payload['readiness_contract_version']}`\n"
              f"- Overall status: `{overall_status}`\n"
              f"- Status reason: `{reason_code}`\n"
              f"- Status summary: {reason_short}\n"
              f"- Generation event: `{event_name or 'local/manual'}`\n"
              f"- App ID source: `{app_id_source}`\n\n"
              "## Next Safe Steps\n" + ("\n".join(f"- {s}" for s in readiness_payload["next_steps"]) if readiness_payload["next_steps"] else "- Setup is ready. Proceed with controlled validation.") + "\n"
          )

          Path("artifacts/onboarding/repobrain_install_readiness.json").write_text(
              json.dumps(readiness_payload, indent=2), encoding="utf-8"
          )
          Path("artifacts/onboarding/repobrain_install_readiness.md").write_text(readiness_md, encoding="utf-8")
          Path("artifacts/foundation_response.md").write_text(body, encoding="utf-8")

          out = os.environ.get("GITHUB_OUTPUT")
          if out:
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"foundation_status={status}\n")
                  fh.write(f"foundation_decision={decision}\n")
                  fh.write(f"should_post={'1' if (not dry_run and issue_number) else '0'}\n")
          PY

      - name: Post foundation response comment
        if: steps.foundation_build.outputs.should_post == '1'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RESPONSE_PATH: artifacts/foundation_response.md
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueRaw = String(process.env.ISSUE_NUMBER || "").trim();
            const issue_number = Number(issueRaw.replace(/^#/, ""));
            if (!issue_number) {
              core.info("Issue number is empty; skip comment post.");
              return;
            }
            const responsePath = process.env.RESPONSE_PATH;
            const body = fs.readFileSync(responsePath, 'utf8');
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Upload RepoBrain audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-audit
          path: artifacts/audit/*.json
          if-no-files-found: ignore

      - name: Upload RepoBrain diagnostic summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-diagnostic-summary
          path: artifacts/diagnostic_summary.md
          if-no-files-found: ignore

      - name: Upload RepoBrain TKYA evidence pack artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-tkya-evidence-pack
          path: |
            artifacts/evidence_pack/repobrain_tkya_evidence_pack_internal.json
            artifacts/evidence_pack/repobrain_tkya_evidence_pack_public_safe.json
            artifacts/evidence_pack/repobrain_tkya_evidence_pack.md
          if-no-files-found: ignore

      - name: Upload RepoBrain install readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-install-readiness
          path: |
            artifacts/onboarding/repobrain_install_readiness.json
            artifacts/onboarding/repobrain_install_readiness.md
          if-no-files-found: ignore





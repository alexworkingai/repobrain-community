name: RepoBrain trusted partner 94E

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = print only, false = post queue acknowledgement"
        required: false
        default: "false"
        type: string
      comment_text:
        description: "RepoBrain validation command text"
        required: false
        default: "/repobrain score"
        type: string
      issue_number:
        description: "Issue or PR number for workflow_dispatch"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  repobrain:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        (
          startsWith(github.event.comment.body, '/repobrain score') ||
          startsWith(github.event.comment.body, '/repobrain audit')
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Queue RepoBrain request
        uses: alexworkingai/RepoBrain-Action@951db370b7d1621243bb1fb79ff5100459fa8af6
        with:
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          comment_text: ${{ github.event_name == 'workflow_dispatch' && inputs.comment_text || github.event.comment.body }}
          issue_number: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
          profile: partner-pilot
          terms_accepted: "true"
          transport_mode: github_app_queue

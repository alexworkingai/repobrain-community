name: RepoBrain self-service pilot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = print only, false = post comment"
        required: false
        default: "false"
        type: string
      comment_text:
        description: "RepoBrain validation command text"
        required: false
        default: "/repobrain score"
        type: string
      issue_number:
        description: "Issue or PR number for workflow_dispatch"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  repobrain:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        (
          startsWith(github.event.comment.body, '/repobrain score') ||
          startsWith(github.event.comment.body, '/repobrain audit')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        id: checkout_ref
        with:
          script: |
            let ref = context.sha;
            let reason = "default_workflow_sha";
            if (context.eventName === "issue_comment" && context.payload.issue?.pull_request) {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const pullNumber = Number(context.payload.issue.number);
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
              const baseRepo = `${owner}/${repo}`.toLowerCase();
              const headRepo = String(pull.head?.repo?.full_name || "").toLowerCase();
              const headSha = String(pull.head?.sha || "").trim();
              if (headRepo === baseRepo && headSha && String(pull.state || "").toLowerCase() === "open") {
                ref = headSha;
                reason = "same_repo_pr_head_sha";
              }
            }
            core.info(`RepoBrain checkout ref resolution: ${reason} -> ${ref}`);
            core.setOutput("ref", ref);
      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.checkout_ref.outputs.ref }}
          fetch-depth: 0
      - name: Run RepoBrain self-service
        uses: alexworkingai/RepoBrain-Action@6b38224bb90adaed41832663112d2437411b12bf
        with:
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          comment_text: ${{ github.event_name == 'workflow_dispatch' && inputs.comment_text || github.event.comment.body }}
          issue_number: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
          profile: partner-pilot
          terms_accepted: "true"
          oidc_audience: repobrain-api
          self_service_mode: "true"
          api_url: ${{ vars.REPOBRAIN_HOSTED_API_URL }}
